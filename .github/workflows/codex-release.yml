name: Codex Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-release
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate release source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          if [ -n "$RELEASE_TAG" ]; then
            test "$RELEASE_TAG" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          fi
      - name: Validate Codex and shared content
        run: |
          npm run lint:portability
          npm run version:check
          npm run test:codex
          node --test tests/opencode/shared-content.test.mjs tests/opencode/package-content.test.mjs
          npm run test:python
      - name: Assemble distribution
        run: |
          npm run stage:codex -- "$RUNNER_TEMP/codex-distribution"
          git rev-parse HEAD > "$RUNNER_TEMP/codex-distribution/SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-distribution
          path: ${{ runner.temp }}/codex-distribution/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: codex-distribution
          path: ${{ runner.temp }}/codex-distribution
      - name: Publish assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          destination="$RUNNER_TEMP/codex-publish"
          remote_ref=$(git ls-remote --heads origin refs/heads/codex-dist)
          if [ -n "$remote_ref" ]; then
            git fetch origin refs/heads/codex-dist
            git worktree add --detach "$destination" FETCH_HEAD
          else
            git worktree add --detach "$destination" HEAD
            git -C "$destination" switch --orphan codex-dist
          fi
          git -C "$destination" rm -r --ignore-unmatch .
          cp -a "$RUNNER_TEMP/codex-distribution/." "$destination/"
          git -C "$destination" add --all
          if git -C "$destination" diff --cached --quiet; then
            echo "Distribution is already current."
          else
            git -C "$destination" commit -m "build(codex): publish $(cat "$RUNNER_TEMP/codex-distribution/SOURCE_COMMIT")"
            git -C "$destination" push origin HEAD:refs/heads/codex-dist
          fi
